# Sequential until the vertical slice has proven stable (see README, "Parallelism").
#
# Playwright objects are bound to the thread that created them, so when this is
# turned on the only safe shape is: classes concurrent, methods on their class's
# thread (`same_thread`). PlaywrightExtension creates Playwright/Browser per
# class and BrowserContext/Page per test, which matches that shape exactly.
# The real ceiling is the backend's per-IP credential rate limit
# (10/min), not CPU, so use a small fixed pool rather than a CPU factor:
#
#   junit.jupiter.execution.parallel.enabled=true
#   junit.jupiter.execution.parallel.mode.default=same_thread
#   junit.jupiter.execution.parallel.mode.classes.default=concurrent
#   junit.jupiter.execution.parallel.config.strategy=fixed
#   junit.jupiter.execution.parallel.config.fixed.parallelism=2
junit.jupiter.execution.parallel.enabled=false
